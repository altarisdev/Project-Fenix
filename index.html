<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Hub de Rotina Definitivo - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @keyframes breathe {
            0%, 100% { transform: scale(0.85); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
        }
        .breathe-animation { animation: breathe 8s ease-in-out infinite; }
        .theme-cyan { --accent: #06b6d4; --accent-light: #22d3ee; }
        .accent-color { color: var(--accent-light); }
        .bg-accent { background-color: var(--accent); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body id="app-body" class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-16 selection:bg-cyan-500 selection:text-slate-900 theme-cyan">

    <div class="flex flex-col items-center p-4 sm:p-6 w-full max-w-md mx-auto">
        
        <!-- HEADER COM GAMIFICAÇÃO -->
        <header class="w-full flex justify-between items-center py-4 mb-2 border-b border-slate-900">
            <div>
                <h1 class="text-xl font-black text-emerald-400 tracking-tight flex items-center gap-2">
                    Meu Hub
                    <span id="streak-tag" class="text-xs bg-amber-500/20 text-amber-400 border border-amber-500/40 px-2 py-0.5 rounded-full font-bold">🔥 0 dias</span>
                </h1>
                <p id="frase-dia" class="text-[11px] text-slate-400 italic mt-0.5 cursor-pointer hover:text-slate-200" title="Clique para trocar">"A clareza precede a maestria." 🔄</p>
            </div>
            <div class="text-right">
                <span id="user-level" class="text-xs font-black accent-color uppercase tracking-wider block">Nível 1</span>
                <span id="user-xp" class="text-[10px] text-slate-500 font-bold">0 / 100 XP</span>
            </div>
        </header>

        <!-- TOOLBAR: HUMOR, MODO FOCO, CALENDÁRIO -->
        <section class="w-full bg-slate-900/40 border border-slate-800/80 rounded-2xl p-3 mb-4 flex justify-between items-center">
            <div class="flex gap-1.5 text-lg" id="mood-selector">
                <button data-mood="😃" class="hover:scale-125 transition-transform">😃</button>
                <button data-mood="🙂" class="hover:scale-125 transition-transform">🙂</button>
                <button data-mood="😐" class="hover:scale-125 transition-transform">😐</button>
                <button data-mood="😔" class="hover:scale-125 transition-transform">😔</button>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-toggle-agenda" class="text-[10px] font-bold text-cyan-400 bg-cyan-950/40 border border-cyan-800 px-2.5 py-1 rounded-xl">📅 Agenda Mensal</button>
                <button id="btn-toggle-foco" class="text-[10px] font-bold text-amber-400 bg-amber-950/40 border border-amber-800 px-2.5 py-1 rounded-xl">🌙 Foco</button>
            </div>
        </section>

        <!-- NOVO: MODAL/SEÇÃO DA AGENDA MENSAL -->
        <section id="secao-agenda-mensal" class="w-full bg-slate-900/90 border border-cyan-500/30 rounded-3xl p-4 mb-4 hidden flex-col gap-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <button id="btn-mes-anterior" class="text-slate-400 hover:text-white px-2">◀</button>
                <h3 id="agenda-mes-ano" class="text-xs font-bold uppercase tracking-wider text-cyan-400">Mês Ano</h3>
                <button id="btn-mes-proximo" class="text-slate-400 hover:text-white px-2">▶</button>
            </div>

            <!-- Dias da Semana Header -->
            <div class="grid grid-cols-7 text-center text-[10px] font-bold text-slate-500">
                <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
            </div>

            <!-- Grid de Dias -->
            <div id="grid-calendario" class="grid grid-cols-7 gap-1 text-center text-xs"></div>

            <div class="border-t border-slate-800 pt-2 flex justify-between items-center">
                <span id="agenda-dia-selecionado" class="text-[10px] text-slate-400 font-bold">Dia selecionado: Hoje</span>
                <button id="btn-fechar-agenda" class="text-[10px] text-rose-400 font-bold">Fechar Agenda</button>
            </div>
        </section>

        <!-- CONTAINER DAS SEÇÕES REGULARES -->
        <div id="secoes-container" class="w-full flex flex-col gap-6">

            <!-- DASHBOARD DE DESEMPENHO -->
            <section class="w-full bg-slate-900/40 border border-slate-800/60 rounded-2xl p-4">
                <h2 class="text-xs font-bold tracking-wider uppercase text-slate-400 mb-3">📊 Dashboard Semanal</h2>
                <div class="grid grid-cols-2 gap-3 items-center">
                    <div class="h-28 relative flex items-center justify-center">
                        <canvas id="chartGeral"></canvas>
                    </div>
                    <div class="flex flex-col gap-2">
                        <div class="bg-slate-950 p-2 rounded-xl border border-slate-800 text-center">
                            <span class="text-[9px] font-bold text-slate-500 uppercase block">Conclusão Diária</span>
                            <span id="txt-taxa-conclusao" class="text-sm font-black text-emerald-400">0%</span>
                        </div>
                        <div class="bg-slate-950 p-2 rounded-xl border border-slate-800 text-center">
                            <span class="text-[9px] font-bold text-slate-500 uppercase block">Carga do Dia</span>
                            <span id="txt-carga-dia" class="text-xs font-bold text-amber-400">Leve 🟢</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- COMPROMISSOS & INTEGRAÇÃO DIÁRIA EXPANDIDA -->
            <section class="w-full flex flex-col gap-3">
                <div class="flex justify-between items-center px-1">
                    <h2 class="text-xs font-bold tracking-wider uppercase text-slate-400">Compromissos do Dia</h2>
                    <!-- Turnos -->
                    <div class="flex bg-slate-900 rounded-lg p-0.5 border border-slate-800">
                        <button onclick="filtrarTurno('todos')" id="turno-todos" class="px-2 py-0.5 text-[9px] font-bold rounded-md bg-slate-800 text-slate-200">Todos</button>
                        <button onclick="filtrarTurno('manha')" id="turno-manha" class="px-2 py-0.5 text-[9px] font-bold rounded-md text-slate-500">🌅 Manhã</button>
                        <button onclick="filtrarTurno('tarde')" id="turno-tarde" class="px-2 py-0.5 text-[9px] font-bold rounded-md text-slate-500">☀️ Tarde</button>
                        <button onclick="filtrarTurno('noite')" id="turno-noite" class="px-2 py-0.5 text-[9px] font-bold rounded-md text-slate-500">🌙 Noite</button>
                    </div>
                </div>

                <div id="lista-compromissos" class="flex flex-col gap-2"></div>

                <!-- Formulário com Data Integrada -->
                <form id="form-compromisso" class="flex flex-col gap-2 bg-slate-900 p-3 rounded-2xl border border-slate-800">
                    <div class="flex gap-2">
                        <input id="input-titulo" type="text" placeholder="Novo compromisso ou tarefa..." required class="bg-transparent text-sm px-2 focus:outline-none flex-1 text-slate-200 placeholder:text-slate-600"/>
                        <input id="input-hora" type="time" required class="bg-slate-950 border border-slate-800 text-xs rounded-lg px-2 py-1 text-slate-300 focus:outline-none"/>
                    </div>
                    <div class="flex justify-between items-center gap-2">
                        <input id="input-data" type="date" class="bg-slate-950 border border-slate-800 text-[11px] rounded-lg px-2 py-1 text-slate-300 focus:outline-none"/>
                        <select id="select-prioridade" class="bg-slate-950 border border-slate-800 text-[11px] rounded-lg px-2 py-1 text-slate-400">
                            <option value="baixa">Baixa 🟢</option>
                            <option value="media" selected>Média 🟡</option>
                            <option value="alta">Alta 🔴</option>
                        </select>
                        <button type="submit" class="bg-accent text-slate-950 font-bold text-xs px-3 py-1 rounded-lg">+ Agendar</button>
                    </div>
                </form>
            </section>

            <!-- HIDRATAÇÃO -->
            <section class="w-full bg-slate-900/60 border border-slate-800/80 rounded-3xl p-5 flex flex-col items-center gap-4 shadow-xl">
                <div class="w-full flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <h2 class="text-xs font-bold tracking-wider uppercase text-slate-400">Hidratação</h2>
                        <button id="btn-config-agua" class="text-[10px] accent-color hover:underline">⚙️ Meta</button>
                    </div>
                    <button id="btn-reset-agua" class="text-[10px] uppercase font-bold text-slate-500 hover:text-rose-400">Resetar</button>
                </div>
                
                <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-blue-600 via-cyan-500 to-teal-400 p-1 active:scale-95 transition-all cursor-pointer" onclick="adicionarAguaRapida(250)">
                    <div class="w-full h-full bg-slate-950 rounded-full flex flex-col items-center justify-center">
                        <span class="text-lg">💧</span>
                        <span id="texto-agua-progresso" class="text-sm font-black text-white">0%</span>
                    </div>
                </div>

                <div class="grid grid-cols-4 gap-2 w-full">
                    <button class="btn-add-agua-val bg-slate-800 text-xs font-bold py-1.5 rounded-xl border border-slate-700/50 accent-color" data-ml="100">+100ml</button>
                    <button class="btn-add-agua-val bg-slate-800 text-xs font-bold py-1.5 rounded-xl border border-slate-700/50 accent-color" data-ml="250">+250ml</button>
                    <button class="btn-add-agua-val bg-slate-800 text-xs font-bold py-1.5 rounded-xl border border-slate-700/50 accent-color" data-ml="300">+300ml</button>
                    <button class="btn-add-agua-val bg-slate-800 text-xs font-bold py-1.5 rounded-xl border border-slate-700/50 accent-color" data-ml="500">+500ml</button>
                </div>
            </section>

            <!-- FINANÇAS RÁPIDAS -->
            <section class="w-full bg-slate-900/40 border border-slate-800/60 rounded-2xl p-4 flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <h2 class="text-xs font-bold tracking-wider uppercase text-slate-400">💸 Gastos de Hoje</h2>
                    <span id="total-gastos-txt" class="text-xs font-black text-rose-400">R$ 0,00</span>
                </div>
                <div id="lista-gastos" class="flex flex-col gap-1.5 max-h-28 overflow-y-auto"></div>
                <form id="form-gasto" class="flex gap-2">
                    <input id="input-gasto-desc" type="text" placeholder="Ex: Almoço, Uber..." required class="bg-slate-950 border border-slate-800 text-xs rounded-xl px-3 py-1.5 flex-1 text-slate-200 focus:outline-none"/>
                    <input id="input-gasto-valor" type="number" step="0.01" placeholder="R$" required class="bg-slate-950 border border-slate-800 text-xs rounded-xl px-2 py-1.5 w-20 text-slate-200 focus:outline-none"/>
                    <button type="submit" class="bg-rose-950 border border-rose-800 text-rose-300 text-xs font-bold px-3 py-1.5 rounded-xl">+</button>
                </form>
            </section>

            <!-- SUPLEMENTOS -->
            <section class="w-full bg-slate-900/40 border border-slate-800/60 rounded-2xl p-4">
                <h2 class="text-xs font-bold tracking-wider uppercase text-slate-400 mb-3">💊 Suplementos & Remédios</h2>
                <div id="lista-suplementos" class="flex flex-col gap-2 mb-3"></div>
                <form id="form-suplemento" class="flex gap-2">
                    <input id="input-suplemento" type="text" placeholder="Ex: Creatina (5g)..." required class="bg-slate-950 border border-slate-800 text-xs rounded-xl px-3 py-1.5 flex-1 text-slate-200 focus:outline-none"/>
                    <button type="submit" class="bg-slate-800 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-700">+</button>
                </form>
            </section>

        </div>

        <footer class="text-center text-[10px] text-slate-600 font-medium tracking-wide border-t border-slate-900 pt-4 w-full flex justify-between items-center mt-6">
            <span>Hub Pro v5.0</span>
            <div class="flex gap-2">
                <button id="btn-exportar" class="hover:text-slate-400">Backup</button>
                <span>•</span>
                <button id="btn-importar" class="hover:text-slate-400">Restaurar</button>
            </div>
        </footer>

    </div>

    <!-- SCRIPT PRINCIPAL -->
    <script>
        let chartGeralInstance = null;
        let filtroTurnoAtual = 'todos';
        let dataCalendarioAtual = new Date();
        let diaSelecionadoAgenda = new Date().toISOString().split('T')[0];

        // Carregar ou inicializar dados
        let appData = JSON.parse(localStorage.getItem('hub_rotina_v5_db')) || {
            tema: 'theme-cyan',
            metaAgua: 2500,
            aguaAtual: 0,
            xp: 0,
            nivel: 1,
            streak: 1,
            suplementos: [{ id: 1, nome: "Creatina", tomado: false }],
            gastos: [],
            compromissos: [
                { id: 1, titulo: "Reunião de Alinhamento", hora: "09:00", data: new Date().toISOString().split('T')[0], prioridade: "alta", concluido: false },
                { id: 2, titulo: "Treino na Academia", hora: "18:30", data: new Date().toISOString().split('T')[0], prioridade: "media", concluido: false }
            ]
        };

        // Definir data de hoje no formulário
        document.getElementById('input-data').value = diaSelecionadoAgenda;

        function salvarDados() {
            localStorage.setItem('hub_rotina_v5_db', JSON.stringify(appData));
            renderizarTudo();
        }

        function adicionarXP(qtd) {
            appData.xp += qtd;
            if (appData.xp >= 100) {
                appData.nivel += 1;
                appData.xp -= 100;
            }
            salvarDados();
        }

        // --- CALENDÁRIO MENSAL ---
        function renderizarCalendario() {
            const grid = document.getElementById('grid-calendario');
            grid.innerHTML = '';

            const ano = dataCalendarioAtual.getFullYear();
            const mes = dataCalendarioAtual.getMonth();

            const nomesMeses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            document.getElementById('agenda-mes-ano').textContent = `${nomesMeses[mes]} ${ano}`;

            const primeiroDiaMes = new Date(ano, mes, 1).getDay();
            const totalDiasMes = new Date(ano, mes + 1, 0).getDate();

            // Espaços em branco antes do 1º dia
            for (let i = 0; i < primeiroDiaMes; i++) {
                grid.appendChild(document.createElement('div'));
            }

            // Dias do mês
            for (let dia = 1; dia <= totalDiasMes; dia++) {
                const diaStr = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
                const temCompromisso = appData.compromissos.some(c => c.data === diaStr);
                
                const btnDia = document.createElement('button');
                btnDia.className = `h-9 flex flex-col items-center justify-center rounded-xl border relative transition-all ${
                    diaStr === diaSelecionadoAgenda ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300 font-bold' : 'bg-slate-950/60 border-slate-800 text-slate-300 hover:border-slate-700'
                }`;
                btnDia.innerHTML = `
                    <span>${dia}</span>
                    ${temCompromisso ? '<span class="w-1.5 h-1.5 rounded-full bg-cyan-400 absolute bottom-1"></span>' : ''}
                `;

                btnDia.onclick = () => {
                    diaSelecionadoAgenda = diaStr;
                    document.getElementById('input-data').value = diaStr;
                    document.getElementById('agenda-dia-selecionado').textContent = `Dia selecionado: ${dia}/${mes+1}/${ano}`;
                    renderizarTudo();
                };

                grid.appendChild(btnDia);
            }
        }

        document.getElementById('btn-toggle-agenda').addEventListener('click', () => {
            const sec = document.getElementById('secao-agenda-mensal');
            sec.classList.toggle('hidden');
            sec.classList.toggle('flex');
            renderizarCalendario();
        });

        document.getElementById('btn-fechar-agenda').addEventListener('click', () => {
            document.getElementById('secao-agenda-mensal').classList.add('hidden');
        });

        document.getElementById('btn-mes-anterior').addEventListener('click', () => {
            dataCalendarioAtual.setMonth(dataCalendarioAtual.getMonth() - 1);
            renderizarCalendario();
        });

        document.getElementById('btn-mes-proximo').addEventListener('click', () => {
            dataCalendarioAtual.setMonth(dataCalendarioAtual.getMonth() + 1);
            renderizarCalendario();
        });

        // --- FILTRO POR TURNO DA TAREFA ---
        function obterTurno(hora) {
            const h = parseInt(hora.split(':')[0]);
            if (h >= 5 && h < 12) return 'manha';
            if (h >= 12 && h < 18) return 'tarde';
            return 'noite';
        }

        function filtrarTurno(turno) {
            filtroTurnoAtual = turno;
            ['todos', 'manha', 'tarde', 'noite'].forEach(t => {
                document.getElementById(`turno-${t}`).className = (t === turno)
                    ? "px-2 py-0.5 text-[9px] font-bold rounded-md bg-slate-800 text-slate-200"
                    : "px-2 py-0.5 text-[9px] font-bold rounded-md text-slate-500";
            });
            renderizarTudo();
        }

        // --- RENDERIZAÇÃO GERAL ---
        function renderizarTudo() {
            document.getElementById('streak-tag').textContent = `🔥 ${appData.streak} dias`;
            document.getElementById('user-level').textContent = `Nível ${appData.nivel}`;
            document.getElementById('user-xp').textContent = `${appData.xp} / 100 XP`;

            // Água
            const pctAgua = Math.min(Math.round((appData.aguaAtual / appData.metaAgua) * 100), 100);
            document.getElementById('texto-agua-progresso').textContent = `${pctAgua}%`;

            // Compromissos do dia selecionado
            const listaComp = document.getElementById('lista-compromissos');
            listaComp.innerHTML = '';

            let compDia = appData.compromissos.filter(c => c.data === diaSelecionadoAgenda);

            if (filtroTurnoAtual !== 'todos') {
                compDia = compDia.filter(c => obterTurno(c.hora) === filtroTurnoAtual);
            }

            if (compDia.length === 0) {
                listaComp.innerHTML = `<p class="text-center text-[11px] text-slate-600 py-3 bg-slate-900/30 rounded-2xl border border-slate-900">Nenhum compromisso para este filtro/dia.</p>`;
            } else {
                compDia.forEach(comp => {
                    const card = document.createElement('div');
                    const badgeCor = comp.prioridade === 'alta' ? 'border-rose-500/40 bg-rose-950/20' : comp.prioridade === 'media' ? 'border-amber-500/40 bg-amber-950/20' : 'border-emerald-500/40 bg-emerald-950/20';
                    card.className = `p-3 rounded-2xl flex justify-between items-center border ${badgeCor} ${comp.concluido ? 'opacity-40 line-through' : ''}`;
                    card.innerHTML = `
                        <div class="flex flex-col gap-0.5 cursor-pointer flex-1" onclick="alternarCompromisso(${comp.id})">
                            <p class="font-bold text-xs text-slate-200">${comp.titulo}</p>
                            <p class="text-[10px] text-slate-400">⏱️ ${comp.hora} • ${obterTurno(comp.hora).toUpperCase()}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="deletarCompromisso(${comp.id})" class="text-xs text-slate-600 hover:text-rose-400 p-1">✕</button>
                            <input type="checkbox" ${comp.concluido ? 'checked' : ''} onclick="alternarCompromisso(${comp.id})" class="accent-cyan-500 w-4 h-4 cursor-pointer">
                        </div>
                    `;
                    listaComp.appendChild(card);
                });
            }

            // Gastos
            const listaGastos = document.getElementById('lista-gastos');
            listaGastos.innerHTML = '';
            let totalGasto = 0;
            (appData.gastos || []).forEach(g => {
                totalGasto += g.valor;
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-slate-950 p-2 rounded-xl border border-slate-800 text-xs";
                item.innerHTML = `
                    <span class="text-slate-300">${g.desc}</span>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-rose-400">R$ ${g.valor.toFixed(2)}</span>
                        <button onclick="deletarGasto(${g.id})" class="text-slate-600 hover:text-rose-400">✕</button>
                    </div>
                `;
                listaGastos.appendChild(item);
            });
            document.getElementById('total-gastos-txt').textContent = `R$ ${totalGasto.toFixed(2)}`;

            // Suplementos
            const listaSup = document.getElementById('lista-suplementos');
            listaSup.innerHTML = '';
            appData.suplementos.forEach(sup => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-slate-950 p-2 rounded-xl border border-slate-800 text-xs";
                item.innerHTML = `
                    <span class="text-slate-300 ${sup.tomado ? 'line-through text-slate-500' : ''}">${sup.nome}</span>
                    <div class="flex items-center gap-2">
                        <button onclick="deletarSuplemento(${sup.id})" class="text-slate-600 hover:text-rose-400 text-xs">✕</button>
                        <input type="checkbox" ${sup.tomado ? 'checked' : ''} onclick="alternarSuplemento(${sup.id})" class="accent-emerald-500 w-4 h-4 cursor-pointer">
                    </div>
                `;
                listaSup.appendChild(item);
            });

            renderizarGraficos();
            renderizarCalendario();
        }

        function renderizarGraficos() {
            const compDia = appData.compromissos.filter(c => c.data === diaSelecionadoAgenda);
            const total = compDia.length || 1;
            const concluidos = compDia.filter(c => c.concluido).length;
            const pct = Math.round((concluidos / total) * 100);

            document.getElementById('txt-taxa-conclusao').textContent = `${pct}%`;
            
            // Indicador de carga
            const cargaTxt = document.getElementById('txt-carga-dia');
            if (compDia.length > 5) cargaTxt.textContent = "Alta 🔴";
            else if (compDia.length >= 3) cargaTxt.textContent = "Média 🟡";
            else cargaTxt.textContent = "Leve 🟢";

            const ctxGeral = document.getElementById('chartGeral').getContext('2d');
            if (chartGeralInstance) chartGeralInstance.destroy();

            chartGeralInstance = new Chart(ctxGeral, {
                type: 'doughnut',
                data: {
                    labels: ['Concluído', 'Pendente'],
                    datasets: [{
                        data: [concluidos, total - concluidos],
                        backgroundColor: ['#10b981', '#1e293b'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '75%',
                    plugins: { legend: { display: false } }
                }
            });
        }

        // --- HANDLERS ---
        document.getElementById('form-compromisso').addEventListener('submit', (e) => {
            e.preventDefault();
            const titulo = document.getElementById('input-titulo').value;
            const hora = document.getElementById('input-hora').value;
            const data = document.getElementById('input-data').value || diaSelecionadoAgenda;
            const prioridade = document.getElementById('select-prioridade').value;

            appData.compromissos.push({ id: Date.now(), titulo, hora, data, prioridade, concluido: false });
            appData.compromissos.sort((a, b) => a.hora.localeCompare(b.hora));
            salvarDados();
            document.getElementById('input-titulo').value = '';
        });

        function alternarCompromisso(id) {
            const c = appData.compromissos.find(item => item.id === id);
            if (c) {
                c.concluido = !c.concluido;
                if (c.concluido) adicionarXP(15);
                else salvarDados();
            }
        }

        function deletarCompromisso(id) {
            appData.compromissos = appData.compromissos.filter(c => c.id !== id);
            salvarDados();
        }

        function adicionarAguaRapida(ml) {
            appData.aguaAtual += ml;
            adicionarXP(10);
        }

        document.querySelectorAll('.btn-add-agua-val').forEach(btn => {
            btn.addEventListener('click', (e) => {
                appData.aguaAtual += parseInt(e.target.getAttribute('data-ml'));
                adicionarXP(10);
            });
        });

        document.getElementById('btn-reset-agua').addEventListener('click', () => {
            appData.aguaAtual = 0;
            salvarDados();
        });

        document.getElementById('form-gasto').addEventListener('submit', (e) => {
            e.preventDefault();
            const desc = document.getElementById('input-gasto-desc').value;
            const valor = parseFloat(document.getElementById('input-gasto-valor').value);
            appData.gastos.push({ id: Date.now(), desc, valor });
            document.getElementById('input-gasto-desc').value = '';
            document.getElementById('input-gasto-valor').value = '';
            salvarDados();
        });

        function deletarGasto(id) {
            appData.gastos = appData.gastos.filter(g => g.id !== id);
            salvarDados();
        }

        document.getElementById('form-suplemento').addEventListener('submit', (e) => {
            e.preventDefault();
            const nome = document.getElementById('input-suplemento').value;
            appData.suplementos.push({ id: Date.now(), nome, tomado: false });
            document.getElementById('input-suplemento').value = '';
            salvarDados();
        });

        function alternarSuplemento(id) {
            const s = appData.suplementos.find(item => item.id === id);
            if (s) {
                s.tomado = !s.tomado;
                if (s.tomado) adicionarXP(10);
                else salvarDados();
            }
        }

        function deletarSuplemento(id) {
            appData.suplementos = appData.suplementos.filter(s => s.id !== id);
            salvarDados();
        }

        document.getElementById('btn-toggle-foco').addEventListener('click', () => {
            document.getElementById('secoes-container').classList.toggle('hidden');
        });

        // Inicializar
        renderizarTudo();
    </script>
</body>
</html>
