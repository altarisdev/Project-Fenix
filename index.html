<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Hub de Rotina</title>
    <!-- Tailwind CSS para estilização rápida e moderna -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-cyan-500 selection:text-slate-900">

    <div class="flex flex-col items-center p-4 sm:p-6 w-full max-w-md mx-auto">
        
        <!-- HEADER -->
        <header class="w-full flex justify-between items-center py-6 mb-4">
            <div>
                <h1 class="text-2xl font-black text-emerald-400 tracking-tight">Meu Hub de Rotina</h1>
                <p class="text-xs text-slate-400 mt-1">Design focado em organização e clareza mental.</p>
            </div>
            <div class="w-10 h-10 bg-slate-900 border border-slate-800 rounded-xl flex items-center justify-center text-lg shadow-inner">
                🧠
            </div>
        </header>

        <!-- SEÇÃO 1: HIDRATAÇÃO -->
        <section class="w-full bg-slate-900/60 border border-slate-800/80 rounded-3xl p-5 flex flex-col items-center gap-4 shadow-xl backdrop-blur-sm mb-6">
            <div class="w-full flex justify-between items-center">
                <h2 class="text-xs font-bold tracking-wider uppercase text-slate-400">Controle de Hidratação</h2>
                <button id="btn-reset-agua" class="text-[10px] uppercase font-bold tracking-wider text-slate-500 hover:text-rose-400 transition-colors">Resetar</button>
            </div>
            
            <!-- Botão de Clique Principal -->
            <button id="btn-add-agua" class="w-36 h-36 rounded-full bg-gradient-to-tr from-blue-600 via-cyan-500 to-teal-400 p-1 shadow-lg shadow-cyan-500/10 active:scale-95 hover:scale-105 transition-all duration-200 group">
                <div class="w-full h-full bg-slate-950 rounded-full flex flex-col items-center justify-center transition-colors group-hover:bg-slate-900/40">
                    <span class="text-3xl mb-1">💧</span>
                    <span class="text-lg font-black text-white">+300ml</span>
                </div>
            </button>

            <!-- Barra de Progresso -->
            <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden mt-2 border border-slate-700/30">
                <div id="barra-agua" class="bg-gradient-to-r from-blue-500 to-cyan-400 h-full w-0 transition-all duration-500 ease-out"></div>
            </div>
            
            <div class="w-full flex justify-between text-xs font-medium text-slate-400">
                <span id="texto-agua-atual">0ml ingeridos</span>
                <span class="text-cyan-400 font-bold">Meta: 2000ml</span>
            </div>
        </section>

        <!-- SEÇÃO 2: COMPROMISSOS -->
        <section class="w-full flex flex-col gap-3 mb-6">
            <h2 class="text-xs font-bold tracking-wider uppercase text-slate-400 px-1">Compromissos do Dia</h2>
            
            <!-- Lista de Compromissos Dinâmica -->
            <div id="lista-compromissos" class="flex flex-col gap-2.5"></div>

            <!-- Formulário Rápido para Criar Compromisso -->
            <form id="form-compromisso" class="flex gap-2 mt-2 bg-slate-900 p-2 rounded-xl border border-slate-800">
                <input 
                    id="input-titulo"
                    type="text" 
                    placeholder="Novo compromisso..." 
                    required
                    class="bg-transparent text-sm px-2 focus:outline-none flex-1 text-slate-200 placeholder:text-slate-600"
                />
                <input 
                    id="input-hora"
                    type="time" 
                    required
                    class="bg-slate-950 border border-slate-800 text-xs rounded-lg px-2 py-1 text-slate-300 focus:outline-none focus:border-cyan-500"
                />
                <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 active:scale-95 text-slate-950 font-bold text-xs px-3 py-1.5 rounded-lg transition-all">
                    +
                </button>
            </form>
        </section>

        <!-- SEÇÃO 3: RESGATE DE HOBBIES -->
        <section class="w-full flex flex-col gap-3 mb-8">
            <h2 class="text-xs font-bold tracking-wider uppercase text-slate-400 px-1">Cuidando de Você (Hobbies)</h2>
            <div class="grid grid-cols-3 gap-2">
                <div class="bg-slate-900/40 border border-slate-800/60 p-3 rounded-2xl flex flex-col items-center text-center gap-1.5 hover:border-slate-700 transition-colors group cursor-pointer">
                    <span class="text-2xl group-hover:scale-110 transition-transform">📚</span>
                    <p class="text-[11px] font-bold text-slate-200 leading-tight">Ler um Livro</p>
                    <span class="text-[9px] font-bold text-emerald-400 uppercase tracking-wider bg-emerald-950/50 border border-emerald-900 px-1.5 py-0.5 rounded-full">15 min</span>
                </div>
                <div class="bg-slate-900/40 border border-slate-800/60 p-3 rounded-2xl flex flex-col items-center text-center gap-1.5 hover:border-slate-700 transition-colors group cursor-pointer">
                    <span class="text-2xl group-hover:scale-110 transition-transform">🎨</span>
                    <p class="text-[11px] font-bold text-slate-200 leading-tight">Desenhar</p>
                    <span class="text-[9px] font-bold text-emerald-400 uppercase tracking-wider bg-emerald-950/50 border border-emerald-900 px-1.5 py-0.5 rounded-full">15 min</span>
                </div>
                <div class="bg-slate-900/40 border border-slate-800/60 p-3 rounded-2xl flex flex-col items-center text-center gap-1.5 hover:border-slate-700 transition-colors group cursor-pointer">
                    <span class="text-2xl group-hover:scale-110 transition-transform">🎮</span>
                    <p class="text-[11px] font-bold text-slate-200 leading-tight">Videogame</p>
                    <span class="text-[9px] font-bold text-emerald-400 uppercase tracking-wider bg-emerald-950/50 border border-emerald-900 px-1.5 py-0.5 rounded-full">20 min</span>
                </div>
            </div>
        </section>

        <!-- MINI FOOTER INFORMATIVO -->
        <footer class="text-center text-[10px] text-slate-600 font-medium tracking-wide border-t border-slate-900 pt-4 w-full">
            Mobile-First MVP • JavaScript Puro Sem Compilação
        </footer>

    </div>

    <!-- LÓGICA DO APLICATIVO -->
    <script>
        const META_AGUA = 2000;

        // --- ESTADO INICIAL ---
        let dadosAgua = parseInt(localStorage.getItem('hub_agua_puro')) || 0;
        let dadosCompromissos = JSON.parse(localStorage.getItem('hub_compromissos_puro')) || [
            { id: 1, titulo: "Tomar Vitaminas", hora: "08:30", concluido: false },
            { id: 2, titulo: "Consulta Médica", hora: "14:00", concluido: false },
            { id: 3, titulo: "Caminhada leve", hora: "18:00", concluido: false }
        ];

        // --- SELEÇÃO DE ELEMENTOS ---
        const btnAddAgua = document.getElementById('btn-add-agua');
        const btnResetAgua = document.getElementById('btn-reset-agua');
        const barraAgua = document.getElementById('barra-agua');
        const textoAguaAtual = document.getElementById('texto-agua-atual');
        const listaCompromissos = document.getElementById('lista-compromissos');
        const formCompromisso = document.getElementById('form-compromisso');
        const inputTitulo = document.getElementById('input-titulo');
        const inputHora = document.getElementById('input-hora');

        // --- FUNÇÕES DE RENDERIZAÇÃO ---
        function atualizarInterfaceAgua() {
            localStorage.setItem('hub_agua_puro', dadosAgua);
            textoAguaAtual.textContent = `${dadosAgua}ml ingeridos`;
            const porcentagem = Math.min((dadosAgua / META_AGUA) * 100, 100);
            barraAgua.style.width = `${porcentagem}%`;
        }

        function renderizarCompromissos() {
            localStorage.setItem('hub_compromissos_puro', JSON.stringify(dadosCompromissos));
            listaCompromissos.innerHTML = '';

            dadosCompromissos.forEach(comp => {
                const card = document.createElement('div');
                card.className = `p-4 rounded-2xl flex justify-between items-center border transition-all cursor-pointer select-none ${
                    comp.concluido 
                    ? 'bg-slate-900/30 border-slate-900 text-slate-500 line-through' 
                    : 'bg-slate-900 border-slate-800 text-slate-200 hover:border-slate-700'
                }`;
                
                card.innerHTML = `
                    <div class="flex flex-col gap-1">
                        <p class="font-semibold text-sm tracking-wide">${comp.titulo}</p>
                        <p class="text-[11px] font-medium text-slate-400 flex items-center gap-1">⏱️ ${comp.hora}</p>
                    </div>
                    <div class="w-5 h-5 rounded-lg border flex items-center justify-center transition-all ${
                        comp.concluido ? 'bg-emerald-500 border-emerald-400 text-slate-950 font-bold text-xs' : 'border-slate-700 bg-slate-950'
                    }">
                        ${comp.concluido ? '✓' : ''}
                    </div>
                `;

                card.addEventListener('click', () => {
                    comp.concluido = !comp.concluido;
                    renderizarCompromissos();
                });

                listaCompromissos.appendChild(card);
            });
        }

        // --- EVENTOS ---
        btnAddAgua.addEventListener('click', () => {
            dadosAgua = Math.min(dadosAgua + 300, META_AGUA * 2);
            atualizarInterfaceAgua();
        });


btnResetAgua.addEventListener('click', () => {
dadosAgua = 0;
atualizarInterfaceAgua();
});
formCompromisso.addEventListener('submit', (e) => {
e.preventDefault();
const novo = {
id: Date.now(),
titulo: inputTitulo.value.trim(),
hora: inputHora.value,
concluido: false
};
dadosCompromissos.push(novo);
dadosCompromissos.sort((a, b) => a.hora.localeCompare(b.hora));
inputTitulo.value = '';
inputHora.value = '';
renderizarCompromissos();
});
// --- INICIALIZAÇÃO OBRIGATÓRIA ---
atualizarInterfaceAgua();
renderizarCompromissos();
